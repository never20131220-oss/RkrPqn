name: Build Seongho Household APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '성호HouseholdApp_AndroidX수정.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unzip Android project
        shell: bash
        run: |
          ZIP_FILE="성호HouseholdApp_AndroidX수정.zip"
          test -f "$ZIP_FILE"

          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          SETTINGS_FILE="$(find extracted -type f -name settings.gradle.kts | head -n 1)"
          test -n "$SETTINGS_FILE"

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          touch "$PROJECT_DIR/gradle.properties"

          if grep -q '^android.useAndroidX=' "$PROJECT_DIR/gradle.properties"; then
            sed -i 's/^android.useAndroidX=.*/android.useAndroidX=true/' "$PROJECT_DIR/gradle.properties"
          else
            echo 'android.useAndroidX=true' >> "$PROJECT_DIR/gradle.properties"
          fi

          echo "===== gradle.properties ====="
          cat "$PROJECT_DIR/gradle.properties"

      - name: Build debug APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SeonghoHousehold-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
